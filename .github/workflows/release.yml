name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            output: portscanner
            asset: GoMap-linux-amd64

          - runner: ubuntu-latest
            platform: linux/arm64
            output: portscanner
            asset: GoMap-linux-arm64
            cross_cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu

          - runner: windows-latest
            platform: windows/amd64
            output: portscanner.exe
            asset: GoMap-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── Linux dependencies ──────────────────────────────────────────────────
      - name: Install webkit2gtk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install arm64 cross-compiler
        if: matrix.cross_pkg != ''
        run: sudo apt-get install -y ${{ matrix.cross_pkg }}

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (arm64 cross-compile)
        if: matrix.cross_cc != ''
        env:
          CC: ${{ matrix.cross_cc }}
          CGO_ENABLED: '1'
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build
        if: matrix.cross_cc == ''
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41

      # ── Rename to final asset name ───────────────────────────────────────────
      - name: Rename asset (Linux)
        if: runner.os == 'Linux'
        run: cp build/bin/${{ matrix.output }} build/bin/${{ matrix.asset }}

      - name: Rename asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item build/bin/${{ matrix.output }} build/bin/${{ matrix.asset }}

      # ── Upload to GitHub Release (tags only) ─────────────────────────────────
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
